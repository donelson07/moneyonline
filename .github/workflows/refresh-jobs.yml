name: Refresh job listings

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run fetch-jobs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Commit updated job data
        run: |
          git config user.name "trabajoremoto-bot"
          git config user.email "bot@trabajoremoto.es"
          git add src/data/jobs.json
          git diff --cached --quiet || git commit -m "chore: refresh job listings"
          git push
